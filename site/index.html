<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>PLY Viewer</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --line:#2c313c; --fg:#e8eaf0; --dim:#9aa3b2; --accent:#4f9dff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #view { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px;
    width:100%; max-width:440px; max-height:100%; overflow:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--dim); margin:4px 0 14px; }
  button, .btn, select, input[type=text] { font:inherit; color:var(--fg); background:#242935; border:1px solid var(--line);
    border-radius:10px; padding:10px 14px; }
  .btn.primary, button.primary { background:var(--accent); border-color:var(--accent); color:#06101f; font-weight:600; }
  .row { display:flex; gap:8px; margin-top:10px; align-items:center; }
  .row > * { flex:1; min-width:0; }
  label { color:var(--dim); font-size:13px; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:18px; text-align:center; margin-bottom:12px; }
  #drop.over { border-color:var(--accent); }
  #file { display:none; }
  .bar { height:8px; background:#242935; border-radius:6px; overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .15s; }
  #err { color:#ff7b7b; margin-top:10px; white-space:pre-wrap; }
  #hud { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:none; gap:8px; background:linear-gradient(transparent, rgba(0,0,0,.65)); flex-wrap:wrap; justify-content:center; }
  #hud button { padding:9px 12px; background:rgba(36,41,53,.92); }
  #hud input[type=range] { flex:1 1 140px; min-width:110px; }
  #info { position:fixed; top:calc(8px + env(safe-area-inset-top)); left:12px; right:12px; font-size:12px; color:var(--dim);
    pointer-events:none; text-shadow:0 1px 2px #000; display:none; }
  .small { font-size:12px; color:var(--dim); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="view"></div>
<div id="info"></div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>PLY Viewer</h1>
    <p>Open a <code>.ply</code> point cloud or mesh. Files up to several GB work: the file is streamed from your
       device and never uploaded.</p>
    <div id="drop">Drop a .ply file here<br><span class="small">or</span></div>
    <input type="file" id="file">
    <div class="row"><label class="btn primary" for="file" style="text-align:center">Choose PLY file</label></div>
    <div class="row">
      <label for="budget" style="flex:0 0 auto">Max points</label>
      <select id="budget">
        <option value="500000">0.5 M (low-end phone)</option>
        <option value="1000000">1 M</option>
        <option value="2000000">2 M</option>
        <option value="4000000">4 M</option>
        <option value="8000000">8 M</option>
        <option value="16000000">16 M (desktop)</option>
      </select>
    </div>
    <div class="row"><input type="text" id="url" placeholder="…or https:// URL (needs CORS + Range)" inputmode="url"><button id="loadUrl" style="flex:0 0 auto">Load</button></div>
    <div id="progress" hidden>
      <div class="bar"><div id="bar"></div></div>
      <div class="small" id="status"></div>
    </div>
    <div id="err"></div>
  </div>
</div>

<div id="hud">
  <button id="open">Open</button>
  <button id="up">Z-up</button>
  <button id="bg">Background</button>
  <button id="reset">Reset view</button>
  <input type="range" id="size" min="1" max="10" step="0.5" value="2" aria-label="Point size">
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
